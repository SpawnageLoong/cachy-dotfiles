; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ellen_joe.png
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "ellen_joe.mp4"
use-background-color = false
background-color = "#000000"
blur = 32
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "center-left"
align = "center"
format = "hh:mm"
font-family = "RedHatDisplay"
font-size = 120
font-weight = 900
color = "#C3C6FB"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "RedHatDisplay"
font-size = 25
font-weight = 600
color = "#C3C6FB"
margin-top = -15

[LockScreen.Message]
display = false
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "RedHatDisplay"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#FFFFFF"
paint-icon = true
spacing = 0

[LoginScreen]
background = "ellen_joe.mp4"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "left"
margin = 50

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 30
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 3
active-border-color = "#c3c6fb"
inactive-border-color = "#c3c6fb"

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 32
font-weight = 700
color = "#C3C6FB"
margin = 20

[LoginScreen.LoginArea.PasswordInput]
width = 400
height = 60
display-icon = true
font-family = "RedHatDisplay"
font-size = 24
icon = "password.svg"
icon-size = 32
content-color = "#C3C6FB"
background-color = "#000000"
background-opacity = 0.0
border-size = 4
border-color = "#C3C6FB"
border-radius-left = 20
border-radius-right = 20
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#C3C6FB"
background-opacity = 0.0
active-background-color = "#C3C6FB"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 36
content-color = "#C3C6FB"
active-content-color = "#000000"
border-size = 4
border-color = "#C3C6FB"
border-radius-left = 20
border-radius-right = 20
margin-left = 10
show-text-if-no-password = true
hide-if-not-needed = true
font-family = "RedHatDisplay"
font-size = 24
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "RedHatDisplay"
font-weight = 600
font-size = 28
icon-size = 60
icon = "spinner.svg"
color = "#FFFFFF"
spacing = 10

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 20
font-weight = 400
normal-color = "#FFFFFF"
warning-color = "#FFFFFF"
error-color = "#FFFFFF"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 50
margin-left = 50
size = 60
border-radius = 10
spacing = 20
font-family = "RedHatDisplay"

[LoginScreen.MenuArea.Popups]
max-height = 600
item-height = 60
item-spacing = 4
padding = 10
display-scrollbar = false
margin = 10
background-color = "#000000"
background-opacity = 1.0
active-option-background-color = "#c3c6fb"
active-option-background-opacity = 1.0
content-color = "#c3c6fb"
active-content-color = "#000000"
font-family = "RedHatDisplay"
border-size = 4
border-color = "#c3c6fb"
font-size = 22
icon-size = 32

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 4
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 400
background-color = "#c3c6fb"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#C3C6FB"
active-content-color = "#000000"
border-size = 0
font-size = 20
icon-size = 32

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-left"
index = 3
popup-direction = "up"
popup-align = "center"
popup-width = 360
display-layout-name = true
background-color = "#C3C6FB"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#C3C6FB"
active-content-color = "#000000"
border-size = 0
font-size = 20
icon = "language.svg"
icon-size = 32

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-left"
index = 2
background-color = "#C3C6FB"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#C3C6FB"
active-content-color = "#000000"
border-size = 0
icon = "keyboard.svg"
icon-size = 32

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-left"
index = 1
popup-direction = "up"
popup-align = "center"
popup-width = 200
background-color = "#C3C6FB"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#C3C6FB"
active-content-color = "#000000"
border-size = 0
icon = "power.svg"
icon-size = 32

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#000000"
background-opacity = 1.0
key-content-color = "#C3C6FB"
key-color = "#000000"
key-opacity = 1.0
key-active-background-color = "#000000"
key-active-opacity = 0.0
selection-background-color = "#303030"
selection-content-color = "#C3C6FB"
primary-color = "#8c90c2"
border-size = 2
border-color = "#C3C6FB"

[Tooltips]
enable = true
font-family = "RedHatDisplay"
font-size = 22
content-color = "#C3C6FB"
background-color = "#000000"
background-opacity = 1.0
border-radius = 10
disable-user = false
disable-login-button = false
